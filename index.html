    function CseConceptBridgeSection({ onSpeak, showToast, addLog, subscribers }) {
      // Bridge 1 State: C Struct to PostgreSQL
      const [b1User, setB1User] = useState('tapos_cse');
      const [b1Rate, setB1Rate] = useState('50M/50M');
      const [b1Pool, setB1Pool] = useState('pppoe_active_pool');
      const [b1TestExecuted, setB1TestExecuted] = useState(false);

      // Bridge 2 State: Berkeley UDP Sockets
      const [b2NasIp, setB2NasIp] = useState('10.10.10.1');
      const [b2Port, setB2Port] = useState('3799');
      const [b2Secret, setB2Secret] = useState('carrier_radius_secret_2026');
      const [b2Code, setB2Code] = useState('40'); // 40 = Disconnect-Request, 43 = CoA-Request
      const [b2Simulating, setB2Simulating] = useState(false);
      const [b2Response, setB2Response] = useState(null);

      // Bridge 3 State: OOP Observer to Laravel 11
      const [b3Trigger, setB3Trigger] = useState('ACTIVE_TO_EXPIRED');
      const [b3Step, setB3Step] = useState(0);
      const [b3Running, setB3Running] = useState(false);

      // Bridge 4 State: DOM to FilamentPHP 3 TALL Stack
      const [b4Columns, setB4Columns] = useState({
        username: true,
        statusBadge: true,
        rxPower: true,
        rateLimit: true,
        bkashTrx: true,
        coaAction: true
      });

      // Handlers for Sandbox Simulators
      const handleRunB1Sandbox = () => {
        setB1TestExecuted(true);
        addLog('INFO', 'C_STRUCT_PG', `FreeRADIUS C thread mapped struct radius_avp for user ${b1User} into radreply (Rate: ${b1Rate}, Pool: ${b1Pool})`);
        showToast('C Struct ➔ PostgreSQL radreply সফলভাবে ম্যাপিং হয়েছে!', 'success');
      };

      const handleRunB2Socket = () => {
        setB2Simulating(true);
        setB2Response(null);
        setTimeout(() => {
          const latency = (3.1 + Math.random() * 1.5).toFixed(2);
          const packetId = Math.floor(10 + Math.random() * 240);
          setB2Response({
            latency,
            packetId,
            nasIp: b2NasIp,
            port: b2Port,
            code: b2Code === '40' ? '41 (Disconnect-ACK)' : '44 (CoA-ACK)',
            hexDump: `0x${b2Code === '40' ? '29' : '2C'} ${packetId.toString(16).padStart(2, '0')} 00 24 5c 9e 1a 88 e2 f1 0d 44 a1 b9 72 c0 01 0b 74 61 70 6f 73 5f 63 73 65`
          });
          setB2Simulating(false);
          addLog('SUCCESS', 'UDP_3799_SOCKET', `RFC 3576 ${b2Code === '40' ? 'Disconnect-Request' : 'CoA-Request'} sent to ${b2NasIp}:${b2Port}. Received ACK in ${latency}ms`);
          showToast(`RFC 3576 UDP 3799 ACK প্রাপ্তি (${latency}ms)!`, 'success');
        }, 350);
      };

      const handleRunB3Pipeline = () => {
        setB3Running(true);
        setB3Step(1);
        setTimeout(() => {
          setB3Step(2);
          setTimeout(() => {
            setB3Step(3);
            setTimeout(() => {
              setB3Step(4);
              setTimeout(() => {
                setB3Step(5);
                setB3Running(false);
                addLog('SUCCESS', 'OBSERVER_HORIZON', `Pipeline executed: Model updated ➔ Observer triggered ➔ PostgreSQL synced ➔ Redis Horizon queue ➔ CoA sent`);
                showToast('Laravel Observer ➔ Redis Horizon পাইপলাইন সম্পন্ন (<3s SLA)!', 'success');
              }, 400);
            }, 350);
          }, 350);
        }, 300);
      };

      return (
        <div className="space-y-8">
          {/* Bridge 1 Card: C Structs ➔ PostgreSQL 16 */}

class SendRadiusCoaDisconnectJob implements ShouldQueue

    use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;

    public int $timeout = 5;

    public function __construct(

    // ==========================================
    // TAB 2: MFS AUTO-UNBLOCK & MIDNIGHT EXPIRY SIMULATOR
    // ==========================================
    function MfsSimulatorTab({
      subscribers,
      setSubscribers,
      systemLogs,
      setSystemLogs,
      addLog,
      showToast
    }) {
      const [selectedSubId, setSelectedSubId] = useState(() => {
        const expired = subscribers.find(s => s.status !== 'ACTIVE');
        return expired ? expired.id : subscribers[0]?.id || '';
      });

      const [selectedGateway, setSelectedGateway] = useState('bkash');
      const [customTrxId, setCustomTrxId] = useState(() => 'BKASH_TXN_' + Math.random().toString(36).substring(2, 8).toUpperCase());
      const [customAmount, setCustomAmount] = useState(1200);
      const [isExecuting, setIsExecuting] = useState(false);
      const [pipelineStep, setPipelineStep] = useState(0);
      const [pipelineStats, setPipelineStats] = useState(null);

      const currentSub = useMemo(() => {
        return subscribers.find(s => s.id === selectedSubId) || subscribers[0];
      }, [subscribers, selectedSubId]);

      useEffect(() => {
        if (currentSub) {
          setCustomAmount(currentSub.monthlyFee || 1200);
        }
      }, [currentSub]);

      const triggerMidnightExpiry = () => {
        const updated = subscribers.map((s, index) => {
          if (s.status !== 'ACTIVE') return s;
          if (index === 0 || index === 2) {
            return {
              ...s,
              status: 'WALLED_GARDEN',
              framedPool: 'walled_garden_pool',
              rateLimit: '512k/512k',
              expiryDate: '2026-10-23 00:01'
            };
          }
          return s;
        });

        setSubscribers(updated);
        addLog('WARN', 'MIDNIGHT_CRON', 'isp:check-expirations executed at 00:01 AM. 2 accounts transitioned to walled_garden_pool (512k/512k)');
        addLog('SUCCESS', 'COA_RFC3576', 'RFC 3576 PoD dispatched to Mikrotik NAS 10.10.10.1. Sessions kicked to apply walled garden profile.');
        showToast('Midnight 00:01 AM batch executed: Overdue subscribers switched to Walled Garden!', 'info');
      };

      const runMfsAutoUnblock = () => {
        if (!currentSub) return;
        setIsExecuting(true);
        setPipelineStep(1);

        const startTime = performance.now();
        const trx = customTrxId;
        const gateway = selectedGateway;
        const amount = customAmount;
        const subUsername = currentSub.username;

        setTimeout(() => {
          setPipelineStep(2);
          addLog('INFO', 'MFS_WEBHOOK', `[Step 1] POST /api/webhook/mfs/${gateway} received. HMAC-SHA256 validated in 12.4ms (TrxID: ${trx})`);

          setTimeout(() => {
            setPipelineStep(3);
            addLog('INFO', 'POSTGRES_TX', `[Step 2] Invoice ${trx} marked PAID (৳${amount}). radreply restored: Mikrotik-Rate-Limit = 50M/50M, Framed-Pool = pppoe_active_pool`);

            setTimeout(() => {
              setPipelineStep(4);

    // TAB 3: 1-2M CARRIER SCALE & BTRC CGNAT CALCULATOR

    function CarrierCgnatTab({ calcState, setCalcState, showToast }) {
      const {
        subscribers,
        arpu,
        bandwidthCommit,
        bandwidthCost,
        resellerSplit,
        privateIpQuery,
        publicBaseSubnet
      } = calcState;

      const updateField = (field, val) => {
        setCalcState(prev => ({ ...prev, [field]: val }));
      };

      const setPreset = (subs) => {
        updateField('subscribers', subs);
        showToast(`Preset loaded: ${formatNumber(subs)} subscribers`, 'info');
      };

      const metrics = useMemo(() => {
        const peakQps = Math.round(subscribers * 0.035);
        const redisMemoryMb = Math.round((subscribers * 750) / (1024 * 1024));
        const dailyPackets = subscribers * 144;
        const dailyStorageGb = ((dailyPackets * 150) / (1024 * 1024 * 1024)).toFixed(1);
        const citusCompressedGb = (dailyStorageGb * 0.1).toFixed(1);
        const monthlyStorageTb = ((citusCompressedGb * 30) / 1024).toFixed(2);
        const annualRetentionTb = (monthlyStorageTb * 12).toFixed(1);

        const grossMonthlyRevenue = subscribers * arpu;
        const totalBandwidthDemandMbps = Math.round(subscribers * bandwidthCommit);
        const upstreamCostMonthly = totalBandwidthDemandMbps * bandwidthCost;
        const resellerPayoutMonthly = grossMonthlyRevenue * (resellerSplit / 100);
        const netMotherIspMargin = grossMonthlyRevenue - upstreamCostMonthly - resellerPayoutMonthly;
        const netMarginPct = ((netMotherIspMargin / grossMonthlyRevenue) * 100).toFixed(1);

        const publicIpsNeeded = Math.ceil(subscribers / 60);
        let cidrEstimate = '/16';
        if (publicIpsNeeded <= 254) cidrEstimate = '/24';
        else if (publicIpsNeeded <= 1022) cidrEstimate = '/22';
        else if (publicIpsNeeded <= 4094) cidrEstimate = '/20';
        else if (publicIpsNeeded <= 8190) cidrEstimate = '/19';
        else if (publicIpsNeeded <= 16382) cidrEstimate = '/18';
        else if (publicIpsNeeded <= 32766) cidrEstimate = '/17';

        return {
          peakQps,
          redisMemoryMb,
          dailyPackets,
          dailyStorageGb,
          citusCompressedGb,
          monthlyStorageTb,
          annualRetentionTb,
          grossMonthlyRevenue,
          totalBandwidthDemandMbps,
          upstreamCostMonthly,
          resellerPayoutMonthly,
          netMotherIspMargin,
          netMarginPct,
          publicIpsNeeded,
          cidrEstimate
        };
      }, [subscribers, arpu, bandwidthCommit, bandwidthCost, resellerSplit]);

      const cgnatLookup = useMemo(() => {
        const parts = privateIpQuery.split('.').map(p => parseInt(p, 10));
        let validIp = parts.length === 4 && parts.every(p => !isNaN(p) && p >= 0 && p <= 255);

        if (!validIp) {
          return { isValid: false, error: 'Enter a valid IPv4 address (e.g. 10.100.14.25)' };
        }

        const privateInt = (parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3];
        const subIndex = Math.abs(privateInt % 60);
        const ipOffset = Math.abs(Math.floor(privateInt / 60) % 250);

        const publicIp = `103.112.40.${10 + ipOffset}`;
        const portStart = 1024 + (subIndex * 1024);
        const portEnd = portStart + 1023;
        const auditId = `BTRC-LI-2026-DHK-${publicIp.replace(/\./g, '-')}-P${portStart}`;
        
        const mikrotikRule = `/ip firewall nat add chain=srcnat action=src-nat to-addresses=${publicIp} to-ports=${portStart}-${portEnd} protocol=tcp src-address=${privateIpQuery} comment="BTRC-RFC6888-${privateIpQuery}"\n/ip firewall nat add chain=srcnat action=src-nat to-addresses=${publicIp} to-ports=${portStart}-${portEnd} protocol=udp src-address=${privateIpQuery} comment="BTRC-RFC6888-${privateIpQuery}"`;

        return {
          isValid: true,
          publicIp,
          subIndex,
          portStart,
          portEnd,
          auditId,
          mikrotikRule
        };
      }, [privateIpQuery]);

      const copyToClipboard = (text, label) => {
        navigator.clipboard.writeText(text);
        showToast(`${label} copied to clipboard!`, 'success');
      };

      return (
        <div className="space-y-6">
          <div className="bg-telecomCard border border-telecomBorder rounded-2xl p-5 shadow-xl">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-base font-bold text-white tracking-tight flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-amberBilling"></span>
                  <span>1-2M Carrier Scale & BTRC Deterministic CGNAT Architecture</span>
                </h2>
                <p className="text-xs text-slate-300 mt-1 max-w-3xl leading-relaxed">
                  Real-time modeling for nationwide Tier-1 and Tier-2 Bangladeshi ISPs. Simulates Redis fast-path 
                  session throughput, Citus columnar storage for FreeRADIUS partitioned <code className="text-cyanPulse">radacct</code>,
                  Mother ISP to Reseller revenue distribution, and <strong>RFC 6888 compliant CGNAT</strong> (1,024 ports per subscriber, 60 subscribers per Public IPv4) for BTRC lawful interception compliance.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-1.5 self-start md:self-auto">
                <span className="text-[11px] text-slate-400 font-semibold mr-1">Scale Presets:</span>
                {[
                  { label: '10K (Thana)', val: 10000 },
                  { label: '50K (District)', val: 50000 },
                  { label: '250K (Nationwide)', val: 250000 },
                  { label: '1M (Carrier)', val: 1000000 },
                  { label: '2M (Megascale)', val: 2000000 }
                ].map(p => (
                  <button
                    key={p.val}
                    onClick={() => setPreset(p.val)}

                  <div className="text-[10px] text-slate-400">Response Code</div>
                  <div className="font-bold text-emeraldSla mt-0.5">Disconnect-ACK (Code 41)</div>
                  <div className="text-[10px] text-slate-400">Packet ID: {data.packetId}</div>
                </div>
                <div className="bg-telecomNavy p-2.5 rounded-lg border border-telecomBorder">

                </div>
              </div>

              <div>
                <div className="text-[10px] text-slate-400 uppercase font-sans mb-1 font-semibold">
                  Raw RFC 3576 radclient Attributes:
                </div>
                <pre className="bg-slate-950 p-3 rounded-lg border border-telecomBorder text-[11px] text-cyan-300 overflow-x-auto leading-relaxed">
{`User-Name = "${data.subscriber.username}"
NAS-IP-Address = ${data.nasIp}
NAS-Port = 3799
Acct-Session-Id = "81c0004f-radius"
Mikrotik-Rate-Limit = "${data.rateLimit}"
Framed-Protocol = PPP

>>> Sent UDP 3799 Disconnect-Request (Code 40)
<<< Received Disconnect-ACK (Code 41) from ${data.nasIp}:${data.coaPort} in ${data.latency}ms`}

                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Package Tariff:</label>
                  <select
                    value={tariff}
                    onChange={(e) => setTariff(e.target.value)}
                    className="w-full bg-telecomNavy border border-telecomBorder rounded-xl px-3 py-2 text-white"
                  >
                    <option value="Starter 20M">Starter 20M (৳700/mo)</option>
                    <option value="Diamond 50M">Diamond 50M (৳1,200/mo)</option>
                    <option value="Titanium 100M">Titanium 100M (৳2,500/mo)</option>
                    <option value="Corporate 200M">Corporate 200M (৳7,000/mo)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Framed-IP (radreply):</label>
                  <input
                    type="text"
                    required
                    value={framedIp}
                    onChange={(e) => setFramedIp(e.target.value)}
                    className="w-full bg-telecomNavy border border-telecomBorder rounded-xl px-3 py-2 text-white font-mono"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Optical Zone:</label>
                  <select
                    value={zone}
                    onChange={(e) => setZone(e.target.value)}
                    className="w-full bg-telecomNavy border border-telecomBorder rounded-xl px-3 py-2 text-white"
                  >
                    <option value="Dhaka North (Gulshan)">Dhaka North (Gulshan)</option>
                    <option value="Dhaka North (Banani)">Dhaka North (Banani)</option>
                    <option value="Dhaka North (Mirpur)">Dhaka North (Mirpur)</option>
                    <option value="Dhaka North (Uttara)">Dhaka North (Uttara)</option>
                    <option value="Dhaka South (Dhanmondi)">Dhaka South (Dhanmondi)</option>
                    <option value="Dhaka South (Motijheel)">Dhaka South (Motijheel)</option>
                    <option value="Chittagong (Agrabad)">Chittagong (Agrabad)</option>
                    <option value="Sylhet (Zindabazar)">Sylhet (Zindabazar)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-300 font-semibold mb-1">ONU RX Power (-18 to -26 dBm):</label>
                  <input
                    type="number"
                    step="0.1"
                    min="-30"
                    max="-10"
                    value={rxPower}
                    onChange={(e) => setRxPower(e.target.value)}
                    className="w-full bg-telecomNavy border border-telecomBorder rounded-xl px-3 py-2 text-white font-mono"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-300 font-semibold mb-1">OLT PON Port Identifier:</label>
                <input
                  type="text"
                  value={oltInfo}
                  onChange={(e) => setOltInfo(e.target.value)}
                  className="w-full bg-telecomNavy border border-telecomBorder rounded-xl px-3 py-2 text-white"
                />
              </div>

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-telecomBorder mt-4">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-2 rounded-xl bg-telecomNavy text-slate-300 border border-telecomBorder text-xs"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-cyanPulse text-telecomNavy font-bold text-xs hover:bg-cyan-400 shadow-md shadow-cyanPulse/20"
                >
                  Save & Provision Subscriber
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render the React application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

    // Service Worker Registration for PWA Offline Launch
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
