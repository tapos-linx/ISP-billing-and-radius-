services:
  # ====================================================================
  # PostgreSQL 16: Monthly Partitioned radacct & High-Speed Lookups
  # Optimized for < 10ms Access-Accept query latency on WSL2
  # ====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: isp_postgres
    restart: always
    environment:
      POSTGRES_DB: isp_billing
      POSTGRES_USER: radius_user
      POSTGRES_PASSWORD: SecretRadiusDbPassword2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./stage1/sql/01-init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
      - ./stage1/sql/02-seed-test-data.sql:/docker-entrypoint-initdb.d/02-seed-test-data.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - isp_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius_user -d isp_billing"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: >
      postgres
        -c shared_buffers=1024MB
        -c effective_cache_size=3072MB
        -c work_mem=64MB
        -c maintenance_work_mem=256MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c max_connections=200

  # ====================================================================
  # Redis 7: Ultra-fast Session Caching & Queue Buffer
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: isp_redis
    restart: always
    command: redis-server --requirepass SecretRedisToken2026! --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - isp_internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "SecretRedisToken2026!", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ====================================================================
  # FreeRADIUS 3.2: High-Performance RADIUS Daemon with rlm_sql
  # Strips Windows CRLF line endings at launch via entrypoint script
  # ====================================================================
  freeradius:
    image: freeradius/freeradius-server:3.2.3-alpine
    container_name: isp_freeradius
    restart: always
    environment:
      PATH: /opt/bin:/opt/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp" # RADIUS Authentication
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp" # RADIUS Accounting
      - "${RADIUS_COA_PORT:-3799}:3799/udp" # RFC 3576 CoA / PoD Disconnect
    volumes:
      - ./stage1/freeradius/clients.conf:/tmp/custom_raddb/clients.conf:ro
      - ./stage1/freeradius/mods-available/sql:/tmp/custom_raddb/sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache libpq >/dev/null 2>&1 || true
        export PATH=/opt/sbin:/opt/bin:$$PATH
        cp /tmp/custom_raddb/clients.conf /opt/etc/raddb/clients.conf
        sed -i 's/\r$$//' /opt/etc/raddb/clients.conf
        cp /tmp/custom_raddb/sql /opt/etc/raddb/mods-available/sql
        sed -i 's/\r$$//' /opt/etc/raddb/mods-available/sql
        ln -sf /opt/etc/raddb/mods-available/sql /opt/etc/raddb/mods-enabled/sql
        ln -sf /opt/etc/raddb/sites-available/coa /opt/etc/raddb/sites-enabled/coa

        # Wait for PostgreSQL port readiness
        until nc -z -w3 postgres 5432; do
          echo "Waiting for PostgreSQL at postgres:5432..."
          sleep 1
        done

        echo "[SUCCESS] Starting FreeRADIUS 3.2 with rlm_sql on UDP ports 1812, 1813, 3799..."
        exec radiusd -f -l stdout
    networks:
      - isp_internal_net

networks:
  isp_internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.10.0/24

volumes:
  postgres_data:
  redis_data:
