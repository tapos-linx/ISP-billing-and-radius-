# ==============================================================================
# Security-Hardened FreeRADIUS clients.conf (Stage 8 Vertical Slice 2)
# Replaces 0.0.0.0/0 with isolated Zero-Risk Lab & WireGuard VPN subnets.
# ==============================================================================

client localhost_radtest {
    ipaddr = 127.0.0.1
    secret = ${ENV:RADIUS_SECRET}
    shortname = local_test_cli
    nas_type = other
}

client docker_virtual_chr_lab {
    ipaddr = 172.16.0.0/12
    secret = ${ENV:RADIUS_SECRET}
    shortname = virtual_chr_lab
    nas_type = mikrotik
    coa_server = coa_chr_lab
}

client wireguard_bras_vpn {
    ipaddr = 10.10.0.0/24
    secret = ${ENV:RADIUS_SECRET}
    shortname = mikrotik_wg_bras
    nas_type = mikrotik
}
