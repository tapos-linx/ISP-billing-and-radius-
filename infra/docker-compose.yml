networks:
  isp_internal_net:
  isp_external_net:
    driver: bridge

volumes:
  citus_master_data:
  redis_data:
  radius_logs:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  radius_secret:
    file: ./secrets/radius_secret.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  bkash_secret:
    file: ./secrets/bkash_secret.txt
  nagad_secret:
    file: ./secrets/nagad_secret.txt

services:
  citus_master:
    image: citusdata/citus:12.1.3-alpine
    container_name: citus_master
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=16", "-c", "max_replication_slots=16"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-isp_bss_oss}
      POSTGRES_USER: ${DB_USERNAME:-isp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      # Network restriction: Citus database is strictly restricted to localhost / internal net
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-5432}:5432"
    secrets:
      - db_password
    volumes:
      - citus_master_data:/var/lib/postgresql/data
      - ./init-citus-shards-complete.sql:/docker-entrypoint-initdb.d/init-citus-shards.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-isp_admin} -d ${DB_DATABASE:-isp_bss_oss}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isp_internal_net
    restart: always

  citus_worker_1:
    image: citusdata/citus:12.1.3-alpine
    container_name: citus_worker_1
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=16", "-c", "max_replication_slots=16"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-isp_bss_oss}
      POSTGRES_USER: ${DB_USERNAME:-isp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - isp_internal_net
    restart: always

  citus_worker_2:
    image: citusdata/citus:12.1.3-alpine
    container_name: citus_worker_2
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=16", "-c", "max_replication_slots=16"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-isp_bss_oss}
      POSTGRES_USER: ${DB_USERNAME:-isp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - isp_internal_net
    restart: always

  redis_cluster:
    image: redis:7.2-alpine
    container_name: redis_cluster
    command: >
      sh -c "
        if [ -f /run/secrets/redis_password ]; then
          AUTH_PASS=$$(cat /run/secrets/redis_password | tr -d '\r\n')
        else
          AUTH_PASS=\"$${REDIS_PASSWORD}\"
        fi
        if [ -n \"$$AUTH_PASS\" ]; then
          exec redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy noeviction --requirepass \"$$AUTH_PASS\"
        else
          exec redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy noeviction
        fi
      "
    ports:
      # Network restriction: Redis cache is strictly restricted to localhost / internal net
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c "
          if [ -f /run/secrets/redis_password ]; then
            redis-cli -a \"$$(cat /run/secrets/redis_password | tr -d '\r\n')\" ping
          elif [ -n \"$$REDIS_PASSWORD\" ]; then
            redis-cli -a \"$$REDIS_PASSWORD\" ping
          else
            redis-cli ping
          fi
        "
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - isp_internal_net
    restart: always

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: freeradius_aaa
    env_file:
      - .env
    ports:
      # RADIUS Authentication & Accounting ports (restricted to NAS / VPN IP via RADIUS_BIND_IP)
      - "${RADIUS_BIND_IP:-0.0.0.0}:${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_BIND_IP:-0.0.0.0}:${RADIUS_ACCT_PORT:-1813}:1813/udp"
      - "${RADIUS_COA_BIND_IP:-0.0.0.0}:${RADIUS_COA_PORT:-3799}:3799/udp"
    secrets:
      - radius_secret
      - db_password
    volumes:
      - ./freeradius:/tmp/custom_raddb:ro
      - radius_logs:/var/log/freeradius
    entrypoint: ["/bin/sh", "/tmp/custom_raddb/entrypoint.sh"]
    depends_on:
      citus_master:
        condition: service_healthy
      redis_cluster:
        condition: service_healthy
    networks:
      - isp_internal_net
      - isp_external_net
    restart: always

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq_broker
    ports:
      # Network restriction: RabbitMQ AMQP and management UI restricted to loopback
      - "${RABBITMQ_BIND_IP:-127.0.0.1}:5672:5672"
      - "${RABBITMQ_MGMT_BIND_IP:-127.0.0.1}:15672:15672"
    secrets:
      - rabbitmq_password
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-isp_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - isp_internal_net
    restart: always

  laravel_app:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    container_name: laravel_bss_oss
    ports:
      - "${LARAVEL_BIND_IP:-0.0.0.0}:${LARAVEL_PORT:-8000}:8000"
    env_file:
      - .env
    secrets:
      - db_password
      - redis_password
      - radius_secret
      - rabbitmq_password
      - bkash_secret
      - nagad_secret
    volumes:
      - .:/var/www/html
    depends_on:
      citus_master:
        condition: service_healthy
      redis_cluster:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - isp_internal_net
      - isp_external_net
    restart: always
