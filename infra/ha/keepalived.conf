vrrp_script chk_freeradius {
    script "/usr/bin/pgrep -x freeradius"
    interval 2
    weight 20
}

vrrp_instance VI_RADIUS {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ${KEEPALIVED_AUTH_PASS}
    }
    virtual_ipaddress {
        10.10.0.10/24
    }
    track_script {
        chk_freeradius
    }
}
