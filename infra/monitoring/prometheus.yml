global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/isp_sla_alerts.yml

scrape_configs:
  - job_name: 'freeradius'
    static_configs:
      - targets: ['freeradius_exporter:9812']
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres_exporter:9187']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
