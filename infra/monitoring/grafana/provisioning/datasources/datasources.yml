apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://isp_prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://isp_loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
