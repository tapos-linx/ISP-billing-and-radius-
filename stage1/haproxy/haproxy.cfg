global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode tcp
    timeout connect 3000ms
    timeout client  15000ms
    timeout server  15000ms
    retries 2

# HAProxy Observability & Health Stats
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 3s
    stats admin if TRUE

# FreeRADIUS Authentication (UDP 1812)
frontend radius_auth_front
    bind *:1812 proto udp
    default_backend radius_auth_back

backend radius_auth_back
    mode tcp
    balance roundrobin
    server freeradius_1 freeradius_1:1812
    server freeradius_2 freeradius_2:1812

# FreeRADIUS Accounting (UDP 1813)
frontend radius_acct_front
    bind *:1813 proto udp
    default_backend radius_acct_back

backend radius_acct_back
    mode tcp
    balance roundrobin
    server freeradius_1 freeradius_1:1813
    server freeradius_2 freeradius_2:1813

# RFC 5176 CoA / PoD Disconnect (UDP 3799)
frontend radius_coa_front
    bind *:3799 proto udp
    default_backend radius_coa_back

backend radius_coa_back
    mode tcp
    balance roundrobin
    server freeradius_1 freeradius_1:3799
    server freeradius_2 freeradius_2:3799
