# -*- text -*-
##
## FreeRADIUS 3.2 Static Fallback Clients Configuration
## Note: FreeRADIUS also reads the dynamic `nas` table from PostgreSQL
##

client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = testing123
    require_message_authenticator = no
    nas_type = other
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

client localhost_ipv6 {
    ipv6addr = ::1
    secret = testing123
    nas_type = other
}

client docker_internal_bridge {
    ipaddr = 172.20.0.0
    netmask = 16
    secret = testing123
    nas_type = other
}

client mikrotik_ccr2004_core {
    ipaddr = 10.10.10.1
    netmask = 32
    secret = RadiusSecretKey2026
    require_message_authenticator = yes
    nas_type = mikrotik
    coa_server = yes
    limit {
        max_connections = 64
        lifetime = 0
        idle_timeout = 60
    }
}
