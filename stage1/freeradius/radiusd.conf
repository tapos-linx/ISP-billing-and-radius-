# -*- text -*-
##
## FreeRADIUS 3.2 Main Server Configuration
## Project: ISP Billing Software (by Tapos)
##

prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = /var/log/radius
raddbdir = /etc/raddb
run_dir = ${localstatedir}/run/radiusd

name = radiusd

# Log to stdout for Docker container inspection
log {
    destination = stdout
    colourise = yes
    file = ${logdir}/radius.log
    stripped_names = no
    auth = yes
    auth_badpass = yes
    auth_goodpass = yes
    msg_denied = "You are not authorized"
}

# Concurrency and Thread Pooling
checkrad = ${sbindir}/checkrad

security {
    user = radius
    group = radius
    allow_core_dumps = no
    max_attributes = 200
    reject_delay = 1
    status_server = yes
}

# Listen on UDP 1812 for Authentication
listen {
    type = auth
    ipaddr = *
    port = 1812
    limit {
        max_connections = 64
        lifetime = 0
        idle_timeout = 30
    }
}

# Listen on UDP 1813 for Accounting
listen {
    type = acct
    ipaddr = *
    port = 1813
    limit {
        max_connections = 64
        lifetime = 0
        idle_timeout = 30
    }
}

# Listen on UDP 3799 for RFC 3576 CoA / PoD Disconnect
listen {
    type = coa
    ipaddr = *
    port = 3799
}

# Include Clients and Modules
$INCLUDE clients.conf
$INCLUDE mods-enabled/
$INCLUDE sites-enabled/
