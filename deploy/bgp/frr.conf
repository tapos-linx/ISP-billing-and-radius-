! FRRouting Anycast AAA Configuration
! Autonomous System: 65001
! Announced VIP: 103.145.10.1/32 (RADIUS Auth / Acct)

frr version 8.5.2
frr defaults traditional
hostname anycast-edge-node
log syslog informational
no ip forwarding
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 103.145.10.1/32
!
router bgp 65001
 bgp router-id 103.145.10.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 bgp graceful-restart
 !
 neighbor UPSTREAM_PEERS peer-group
 neighbor UPSTREAM_PEERS remote-as external
 neighbor UPSTREAM_PEERS capability dynamic
 neighbor UPSTREAM_PEERS bfd
 !
 neighbor 192.168.100.1 peer-group UPSTREAM_PEERS
 neighbor 192.168.100.1 description Upstream-Tier1-Transit-A
 !
 neighbor 192.168.100.2 peer-group UPSTREAM_PEERS
 neighbor 192.168.100.2 description Upstream-BDIX-National-IXP
 !
 address-family ipv4 unicast
  network 103.145.10.1/32 route-map RM_ANYCAST_EXPORT
  neighbor UPSTREAM_PEERS activate
  neighbor UPSTREAM_PEERS next-hop-self
  neighbor UPSTREAM_PEERS send-community both
 exit-address-family
!
route-map RM_ANYCAST_EXPORT permit 10
 match ip address prefix-list PL_ANYCAST_VIP
 set community 65001:100
!
route-map RM_ANYCAST_DRAIN permit 10
 match ip address prefix-list PL_ANYCAST_VIP
 set as-path prepend 65001 65001 65001
 set community 65001:200
!
ip prefix-list PL_ANYCAST_VIP permit 103.145.10.1/32
!
line vty
!
