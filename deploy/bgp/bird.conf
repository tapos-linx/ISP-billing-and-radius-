# BIRD 2.x Multi-Region Anycast AAA Configuration
# Autonomous System: 65001
# Anycast VIP: 103.145.10.1/32

log syslog all;
router id 103.145.10.1;

protocol device {
    scan time 5;
}

protocol direct {
    ipv4;
    interface "lo";
}

# BFD Protocol for sub-second failure detection
protocol bfd {
    interface "*" {
        min rx interval 100 ms;
        min tx interval 100 ms;
        multiplier 3;
    };
}

filter anycast_export {
    if net = 103.145.10.1/32 then {
        bgp_community.add((65001, 100));
        accept;
    }
    reject;
}

filter anycast_drain {
    if net = 103.145.10.1/32 then {
        bgp_path.prepend(65001);
        bgp_path.prepend(65001);
        bgp_community.add((65001, 200));
        accept;
    }
    reject;
}

# BGP Session to Upstream Transit
protocol bgp upstream_transit_1 {
    local as 65001;
    neighbor 192.168.100.1 as 64512;
    bfd yes;
    ipv4 {
        import none;
        export filter anycast_export;
    };
}

# BGP Session to BDIX National IXP
protocol bgp bdix_ixp_1 {
    local as 65001;
    neighbor 192.168.100.2 as 64513;
    bfd yes;
    ipv4 {
        import none;
        export filter anycast_export;
    };
}
