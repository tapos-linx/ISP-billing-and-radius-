# Carrier Multi-Region Inventory
# Environments: Production POPs (Dhaka DC1, Chattogram DC2, Sylhet DC3)

[all:vars]
ansible_user=carrier_ops
ansible_python_interpreter=/usr/bin/python3
carrier_asn=65001
anycast_vip=103.145.10.1

[core_coordinator]
citus-master-dc1.isp.carrier.net ansible_host=10.100.2.10

[citus_workers]
citus-worker-01-dc1.isp.carrier.net ansible_host=10.100.2.11
citus-worker-02-dc1.isp.carrier.net ansible_host=10.100.2.12
citus-worker-03-dc2.isp.carrier.net ansible_host=10.200.2.11

[clickhouse_ipdr]
clickhouse-dc1.isp.carrier.net ansible_host=10.100.2.20
clickhouse-dc2.isp.carrier.net ansible_host=10.200.2.20

[redis_sentinel]
redis-node-01.isp.carrier.net ansible_host=10.100.2.30
redis-node-02.isp.carrier.net ansible_host=10.100.2.31
redis-node-03.isp.carrier.net ansible_host=10.200.2.30

[edge_anycast_radius]
radius-pop1-dhaka.isp.carrier.net ansible_host=10.100.1.10 pop_code=dhaka-central pop_asn=65001 bgp_metric=100
radius-pop2-ctg.isp.carrier.net ansible_host=10.200.1.10 pop_code=ctg-agrabad pop_asn=65002 bgp_metric=120
radius-pop3-sylhet.isp.carrier.net ansible_host=10.300.1.10 pop_code=sylhet-hub pop_asn=65003 bgp_metric=150

[carrier_cluster:children]
core_coordinator
citus_workers
clickhouse_ipdr
redis_sentinel
edge_anycast_radius
