---
# FreeRADIUS 3.2.3 Carrier High-Performance AAA Configuration
- name: Install FreeRADIUS Core and Modules
  ansible.builtin.package:
    name:
      - freeradius
      - freeradius-postgresql
      - freeradius-rest
      - freeradius-utils
    state: present

- name: Deploy RADIUS Dictionaries & Custom VSAs
  ansible.builtin.copy:
    src: dictionary.custom
    dest: /etc/freeradius/3.0/dictionary.custom
    mode: '0644'

- name: Configure FreeRADIUS Clients
  ansible.builtin.template:
    src: clients.conf.j2
    dest: /etc/freeradius/3.0/clients.conf
    owner: freerad
    group: freerad
    mode: '0640'
  notify: Restart FreeRADIUS

- name: Enable RFC 3576 / RFC 5176 CoA Listener (Port 3799)
  ansible.builtin.file:
    src: /etc/freeradius/3.0/sites-available/coa
    dest: /etc/freeradius/3.0/sites-enabled/coa
    state: link
  notify: Restart FreeRADIUS

- name: Ensure FreeRADIUS Service is Enabled and Running
  ansible.builtin.service:
    name: freeradius
    state: started
    enabled: true
